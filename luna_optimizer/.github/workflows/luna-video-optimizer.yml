name: Luna Video Optimizer

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "New Luna video idea"
        required: true
        type: string
      report_path:
        description: "Optional analysis report JSON path"
        required: false
        default: "luna_optimizer/data/reelrise_report.json"
        type: string
      performance_path:
        description: "Optional Luna performance JSON path"
        required: false
        default: "luna_optimizer/data/luna_performance.json"
        type: string

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Luna production brief
        run: |
          python3 luna_optimizer/scripts/luna_optimizer.py \
            --idea "${{ inputs.idea }}" \
            --report "${{ inputs.report_path }}" \
            --performance "${{ inputs.performance_path }}"

      - name: Build ChatCut bridge manifest
        run: |
          python3 luna_optimizer/scripts/chatcut_bridge.py             --brief luna_optimizer/outputs/luna_video_brief.md             --output luna_optimizer/outputs/chatcut_edit_plan.json

      - name: Upload Luna + ChatCut edit package
        uses: actions/upload-artifact@v4
        with:
          name: luna-chatcut-edit-package
          path: |
            luna_optimizer/outputs/luna_video_brief.md
            luna_optimizer/outputs/chatcut_edit_plan.json
