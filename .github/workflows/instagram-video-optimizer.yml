name: Instagram Video Optimizer

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct HTTPS URL to the source MP4"
        required: true
        type: string

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output input.mp4 \
            "\${{ inputs.video_url }}"
          file input.mp4
          test -s input.mp4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Optimize
        run: python3 tools/instagram_video_optimizer.py input.mp4 luna_instagram_ready.mp4

      - name: Upload optimized video
        uses: actions/upload-artifact@v4
        with:
          name: luna-instagram-ready
          path: luna_instagram_ready.mp4
          retention-days: 7
