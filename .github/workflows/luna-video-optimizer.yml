name: Luna Video Optimizer

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "New Luna video idea"
        required: true
        type: string
      report_path:
        description: "Optional analysis report JSON path"
        required: false
        default: "luna_optimizer/data/reelrise_report.json"
        type: string
      performance_path:
        description: "Optional Luna performance JSON path"
        required: false
        default: "luna_optimizer/data/luna_performance.json"
        type: string
      trend_report_path:
        description: "Optional luxury storytelling trend analysis JSON path"
        required: false
        default: "luna_optimizer/data/luxury_storytelling_trends.json"
        type: string

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Luna production brief
        run: |
          python3 luna_optimizer/scripts/luna_optimizer.py \
            --idea "${{ inputs.idea }}" \
            --report "${{ inputs.report_path }}" \
            --performance "${{ inputs.performance_path }}" \
            --trend-report "${{ inputs.trend_report_path }}"
      - name: Upload production brief
        uses: actions/upload-artifact@v4
        with:
          name: luna-video-brief
          path: luna_optimizer/outputs/luna_video_brief.md
